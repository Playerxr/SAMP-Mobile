name: Android APK - GTA 2.10

on:
  push:
    branches: [GTA-2.10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI_KEYSTORE: ${{ github.workspace }}/.ci-debug.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Create test signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$CI_KEYSTORE" -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure CI signing and CMake
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/samp-ci.gradle" <<'GROOVY'
          gradle.beforeProject { p ->
              p.afterEvaluate {
                  if (p.plugins.hasPlugin('com.android.application')) {
                      def android = p.extensions.getByName('android')
                      if (p.hasProperty('ciTestInstall')) {
                          android.defaultConfig.applicationId = 'com.samp.mobile.test'
                      }
                      def ciSigning = android.signingConfigs.create('ciDebug')
                      ciSigning.storeFile = new File(System.getenv('CI_KEYSTORE'))
                      ciSigning.storePassword = 'android'
                      ciSigning.keyAlias = 'androiddebugkey'
                      ciSigning.keyPassword = 'android'
                      android.buildTypes.getByName('debug').signingConfig = ciSigning
                      android.externalNativeBuild.cmake.version = '3.22.1'
                  }
              }
          }
          GROOVY

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            --init-script "$RUNNER_TEMP/samp-ci.gradle" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-GTA-2.10-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare isolated test package
        shell: bash
        run: |
          python3 - <<'PY'
          import copy, json, pathlib
          path = pathlib.Path('app/google-services.json')
          config = json.loads(path.read_text())
          client = copy.deepcopy(next(c for c in config['client']
              if c['client_info']['android_client_info']['package_name'] == 'com.samp.mobile'))
          client['client_info']['android_client_info']['package_name'] = 'com.samp.mobile.test'
          config['client'].append(client)
          path.write_text(json.dumps(config))
          PY

      - name: Build isolated test APK
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            --init-script "$RUNNER_TEMP/samp-ci.gradle" -PciTestInstall=true :app:assembleDebug

      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-GTA-2.10-isolated-test
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            build/reports/
            app/.cxx/**/CMakeFiles/CMakeError.log
            app/.cxx/**/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 7
